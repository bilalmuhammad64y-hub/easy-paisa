<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f3f4f6; }
    .admin-shell { max-width: 1200px; margin: 40px auto; padding: 0 16px 60px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
    .topbar h1 { margin: 0; font-size: clamp(2rem,3vw,2.7rem); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: white; border-radius: 18px; padding: 20px; border: 1px solid #e5e7eb; box-shadow: 0 8px 16px rgba(15,23,42,0.04); }
    .stat-card h3 { margin: 0 0 8px; color: #6b7280; font-size: 0.9rem; }
    .stat-card strong { font-size: 2rem; }
    .admin-grid { display: grid; grid-template-columns: 440px 1fr; gap: 24px; }
    .panel { background: white; border-radius: 20px; padding: 22px; box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04); border: 1px solid #e5e7eb; }
    form { display: grid; gap: 14px; }
    form label { font-weight: 700; }
    form input, form textarea { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 12px; background: white; font: inherit; }
    form textarea { resize: vertical; min-height: 90px; }
    .product-list { display: grid; gap: 12px; }
    .product-item { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; background: #f9fafb; }
    .product-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 12px; }
    .product-item h4 { margin: 0 0 4px; }
    .product-item p { margin: 4px 0; color: #6b7280; }
    .actions { display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; padding: 12px 18px; }
    .btn-primary { background: #2563eb; color: white; }
    .muted { background: #e2e8f0; color: #0f172a; }
    .danger { background: #dc2626; color: white; }
    .status { margin-top: 12px; min-height: 20px; color: #2563eb; font-weight: 600; }
    .orders-list { display: grid; gap: 10px; }
    .order-item { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; background: #f9fafb; }
    .order-item strong { display: block; }
    @media (max-width: 900px) { .admin-grid, .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="topbar">
      <h1>Admin Dashboard</h1>
      <button id="logoutBtn" class="btn btn-primary">Logout</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Products</h3><strong id="totalProducts">0</strong></div>
      <div class="stat-card"><h3>Customers</h3><strong id="totalCustomers">0</strong></div>
      <div class="stat-card"><h3>Orders</h3><strong id="totalOrders">0</strong></div>
      <div class="stat-card"><h3>Revenue</h3><strong id="totalRevenue">$0</strong></div>
    </div>

    <div class="admin-grid">
      <section class="panel">
        <h3>Add / Edit Product</h3>
        <form id="productForm" enctype="multipart/form-data">
          <input type="hidden" id="productId" />
          <div>
            <label>Name</label>
            <input type="text" id="name" required />
          </div>
          <div>
            <label>Category</label>
            <input type="text" id="category" required />
          </div>
          <div>
            <label>Price</label>
            <input type="number" id="price" step="0.01" required />
          </div>
          <div>
            <label>Old Price</label>
            <input type="number" id="oldPrice" step="0.01" />
          </div>
          <div>
            <label>Image Upload</label>
            <input type="file" id="image" accept="image/*" />
          </div>
          <div>
            <label>Description</label>
            <textarea id="description"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </form>
        <p id="status" class="status"></p>
      </section>

      <section class="panel">
        <h3>Recent Orders</h3>
        <div id="ordersList" class="orders-list" style="margin-top: 12px;"></div>
        <h3 style="margin-top: 24px;">Product List</h3>
        <div id="productList" class="product-list" style="margin-top: 12px;"></div>
      </section>
    </div>
  </div>

  <script>
    const productForm = document.getElementById('productForm');
    const productList = document.getElementById('productList');
    const ordersList = document.getElementById('ordersList');
    const status = document.getElementById('status');

    async function fetchSession() {
      const res = await fetch('/api/session');
      const data = await res.json();
      if (!data.loggedIn || data.user.role !== 'admin') {
        window.location.href = '/admin/login';
      }
    }

    async function loadStats() {
      const res = await fetch('/api/admin/stats');
      const stats = await res.json();
      document.getElementById('totalProducts').textContent = stats.totalProducts;
      document.getElementById('totalCustomers').textContent = stats.totalCustomers;
      document.getElementById('totalOrders').textContent = stats.totalOrders;
      document.getElementById('totalRevenue').textContent = `$${stats.totalRevenue}`;

      ordersList.innerHTML = '';
      if (!stats.recentOrders || stats.recentOrders.length === 0) {
        ordersList.innerHTML = '<div class="order-item">No orders yet.</div>';
        return;
      }

      stats.recentOrders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'order-item';
        card.innerHTML = `<strong>Order total: $${order.total}</strong><span>${new Date(order.createdAt).toLocaleDateString()}</span>`;
        ordersList.appendChild(card);
      });
    }

    async function loadProducts() {
      const response = await fetch('/api/products');
      const products = await response.json();
      productList.innerHTML = '';

      products.forEach(product => {
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <img src="${product.image || 'https://placehold.co/300x300'}" alt="${product.name}" />
          <div>
            <h4>${product.name}</h4>
            <p>${product.category}</p>
            <p>$${product.price}</p>
          </div>
          <div class="actions">
            <button class="btn muted edit-btn" type="button" data-id="${product._id}">Edit</button>
            <button class="btn danger delete-btn" type="button" data-id="${product._id}">Delete</button>
          </div>
        `;
        productList.appendChild(item);
      });

      productList.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.getAttribute('data-id');
          const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
          const result = await res.json();
          status.textContent = result.message;
          loadProducts();
          loadStats();
        });
      });

      productList.querySelectorAll('.edit-btn').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.getAttribute('data-id');
          const res = await fetch('/api/products');
          const products = await res.json();
          const product = products.find(item => item._id === id);
          if (!product) return;
          document.getElementById('productId').value = product._id;
          document.getElementById('name').value = product.name;
          document.getElementById('category').value = product.category;
          document.getElementById('price').value = product.price;
          document.getElementById('oldPrice').value = product.oldPrice || 0;
          document.getElementById('description').value = product.description || '';
          status.textContent = `Editing: ${product.name}`;
        });
      });
    }

    productForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Saving product...';

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('oldPrice', document.getElementById('oldPrice').value || 0);
      formData.append('description', document.getElementById('description').value);

      const fileInput = document.getElementById('image');
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      const productId = document.getElementById('productId').value;
      const method = productId ? 'PUT' : 'POST';
      const url = productId ? `/api/products/${productId}` : '/api/products';

      const response = await fetch(url, {
        method,
        body: formData
      });

      const result = await response.json();
      status.textContent = result.message || 'Product saved';
      productForm.reset();
      loadProducts();
      loadStats();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    fetchSession();
    loadStats();
    loadProducts();
  </script>
</body>
</html>
